<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTG Live Bulk Scanner</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 16px;
            max-width: 600px;
            margin: auto;
        }
        h1 { font-size: 1.5rem; color: #bb86fc; text-align: center; }
        .card {
            background: #1e1e1e;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .video-container {
            position: relative;
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
        }
        video {
            width: 100%;
            height: auto;
            display: block;
        }
        /* Fokus-Rahmen als Lesehilfe für den Kartennamen */
        .scan-overlay {
            position: absolute;
            top: 10%;
            left: 5%;
            width: 90%;
            height: 25%;
            border: 2px dashed #bb86fc;
            box-sizing: border-box;
            pointer-events: none;
        }
        button {
            display: block;
            width: 100%;
            background-color: #bb86fc;
            color: #121212;
            border: none;
            padding: 14px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            margin-top: 10px;
        }
        .result-box {
            background: #2c2c2c;
            padding: 12px;
            border-radius: 8px;
            margin-top: 10px;
        }
        .hit { color: #4caf50; font-weight: bold; font-size: 1.2rem; }
        .miss { color: #888; }
        .counter-list { margin-top: 10px; font-size: 0.9rem; color: #b0b0b0; }
        canvas { display: none; }
    </style>
</head>
<body>

    <h1>MTG Live Scanner 📷</h1>

    <div class="card">
        <h3>Live-Kamera</h3>
        <div class="video-container">
            <video id="video" autoplay playsinline muted></video>
            <div class="scan-overlay"></div>
        </div>
        <button id="toggleBtn">Start / Stopp Live-Scan</button>
        <p style="font-size: 0.8rem; color: #888; text-align: center; margin-top: 5px;">
            Platziere den Kartennamen im gestrichelten Rahmen.
        </p>
    </div>

    <div class="card">
        <h3>Aktueller Live-Erkennung</h3>
        <div class="result-box" id="resultBox">
            Kamera wird gestartet...
        </div>
    </div>

    <div class="card">
        <h3>Treffer-Historie</h3>
        <div class="counter-list" id="counterList">
            Noch keine Treffer erfasst.
        </div>
    </div>

    <!-- Unsichtbares Canvas für Schnappschüsse -->
    <canvas id="canvas"></canvas>

    <script>
        // Integrierte Wunschlisten (Englisch & Deutsch)[cite: 1, 2]
        const mtgWishlist = {
            "abundance": 1, "agent frank horrigan": 1, "aqueous form": 1, "arcane signet": 1,
            "augur of autumn": 1, "authority of the consuls": 1, "avenger of zendikar": 1, "baldur's gate": 1,
            "belladonna took": 1, "bilious skulldweller": 1, "black dragon gate": 1, "blackbloom rogue": 1,
            "bloated contaminator": 1, "boggart trawler": 1, "bonny pall, clearcutter": 1, "broken bond": 1,
            "captain marvel, earth's protector": 1, "case of the uneaten feast": 1, "circuitous route": 1,
            "clifftop lookout": 1, "copy land": 1, "core prowler": 1, "courser of kruphix": 1, "disorienting choice": 1,
            "district guide": 1, "dollmaker's shop/porcelain gallery": 1, "druid class": 1, "essence channeler": 1,
            "evolution sage": 1, "exemplar of light": 1, "expedition map": 1, "explore": 1, "explore the underdark": 1,
            "fountainport": 1, "gatebreaker ram": 1, "gatecreeper vine": 1, "gatekeeper gargoyle": 1, "gateway plaza": 1,
            "gateway sneak": 1, "glaive of the guildpact": 1, "golgari rot farm": 1, "gond gate": 1, "gretchen titchwillow": 1,
            "growth spiral": 1, "guild summit": 1, "haliya, guided by light": 1, "heap gate": 1, "hostile hostel": 1,
            "hour of promise": 1, "kazandu mammoth": 1, "leonin vanguard": 1, "llanowar scout": 1, "maze's end": 1,
            "minwu, white mage": 1, "navigation orb": 1, "nine-fingers keene": 1, "nylea's intervention": 1,
            "omo, queen of vesuva": 1, "open the way": 1, "oracle of mul daya": 1, "planar nexus": 1, "plaza of harmony": 1,
            "pollenbright druid": 1, "rampaging baloths": 1, "restoration seminar": 1, "retreat to hagra": 1,
            "sage of the maze": 1, "scaled herbalist": 1, "scheming aspirant": 1, "smile at death": 1, "splendid reclamation": 1,
            "sylvan scrying": 1, "tangled florahedron": 1, "tempt with discovery": 1, "thespian's stage": 1,
            "thran portal": 1, "through the forest gate": 1, "thrumming hivepool": 1, "titania's command": 1,
            "ulvenwald hydra": 1, "urza's cave": 1, "venerated rotpriest": 1, "wrenn and seven": 1,
            // Deutsch[cite: 2]
            "arkanes petschaft": 1, "aufgeblähter verseucher": 1, "augurin des herbstes": 1, "autorität der konsuln": 1,
            "baldurs tor": 1, "belladonna tuk": 1, "boggart-fischerin // boggart-moor": 1, "bonny pall, die abholzerin": 1,
            "captain marvel, beschützerin der erde": 1, "distriktführerin": 1, "durch die waldpforte": 1,
            "durchtrennte bande": 1, "ende des labyrinths": 1, "erkunden": 1, "erkundung des unterreichs": 1,
            "essenz-kanalisierer": 1, "expeditionskarte": 1, "fall des unberührten festmahls": 1, "gallehaltiger hirnbewohner": 1,
            "gipfeltreffen der gilden": 1, "glefe des gildenbunds": 1, "golgari-verrottungsfarm": 1, "gondstor": 1,
            "gretchen weidenknirps": 1, "haldentor": 1, "haliya, geleitet vom licht": 1, "heimtückische aspirantin": 1,
            "kazandu-mammut // kazandu-tal": 1, "kernstrolcher": 1, "klasse der druiden": 1, "klippen-ausguck": 1,
            "landduplikat": 1, "leoniden-vorhut": 1, "llanowarspäher": 1, "min'u, der weißmagier": 1, "navigationskugel": 1,
            "neunfinger kien": 1, "nyleas eingreifen": 1, "omo, königin von vesuva": 1, "orakel von mul daya": 1,
            "platz der harmonie": 1, "pollenbenetzer-druidin": 1, "prächtige renaturierung": 1,
            "puppenwerkstatt // porzellangalerie": 1, "rennerin des kruphix": 1, "restaurationsseminar": 1,
            "rückzug nach hagra": 1, "schuppige kräuterkundlerin": 1, "schwarzblütenräuberin // schwarzblütenmoor": 1,
            "schwarzdrachentor": 1, "stunde der verheißung": 1, "surrendes schwarmbecken": 1, "theaterbühne": 1,
            "thran-portal": 1, "titanias befehl": 1, "tobende baloths": 1, "torbrechender widder": 1, "torplatz": 1,
            "torschleicherin": 1, "torumschlingende ranke": 1, "torwächter-gargoyle": 1, "tümpelhaven": 1,
            "ulvenwald-hydra": 1, "ungastliche herberge // kriechendes gasthaus": 1, "urzas höhle": 1, "verachtung des todes": 1,
            "verehrte fäulnispriesterin": 1, "verlockung der entdeckung": 1, "verschlungene pfade": 1,
            "verschlungenes pflanzenpolyeder // verschlungenes tal": 1, "verwirrendes dilemma": 1, "vorbild des lichts": 1,
            "wachstumsspirale": 1, "wald-hellseherei": 1, "wassergestalt": 1, "weiser evolutionskundler": 1,
            "weiser des labyrinths": 1, "weltennexus": 1, "wrenn und sieben": 1, "zendikars rächer": 1,
            "öffnung des weges": 1, "überfluss": 1
        };

        const foundCounts = {};
        let isScanning = false;
        let worker = null;
        let lastScannedCard = "";

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const toggleBtn = document.getElementById('toggleBtn');
        const resultBox = document.getElementById('resultBox');
        const counterListDiv = document.getElementById('counterList');

        // Kamera starten
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment" } // Rückkamera nutzen
                });
                video.srcObject = stream;
                
                // OCR-Worker im Hintergrund vorladen
                worker = await Tesseract.createWorker('eng+deu');
                resultBox.innerHTML = "Bereit zum Scannen!";
                startScanning();
            } catch (err) {
                console.error(err);
                resultBox.innerHTML = "<span class='miss'>Kamerazugriff fehlgeschlagen. Bitte HTTPS-Verbindung prüfen!</span>";
            }
        }

        function startScanning() {
            isScanning = true;
            toggleBtn.innerText = "Scan Pausieren";
            scanLoop();
        }

        function stopScanning() {
            isScanning = false;
            toggleBtn.innerText = "Scan Starten";
        }

        toggleBtn.addEventListener('click', () => {
            if (isScanning) stopScanning();
            else startScanning();
        });

        async function scanLoop() {
            if (!isScanning) return;

            // Bild aus Video auf Canvas zeichnen
            const ctx = canvas.getContext('2d');
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            try {
                // OCR auf dem aktuellen Frame ausführen
                const ret = await worker.recognize(canvas);
                const rawText = ret.data.text.trim();
                processLiveText(rawText);
            } catch (e) {
                console.error(e);
            }

            // Nächsten Durchlauf starten
            if (isScanning) {
                setTimeout(scanLoop, 500); // Scanned alle 500ms (2x pro Sekunde)
            }
        }

        function processLiveText(rawText) {
            const cleanText = rawText.toLowerCase().replace(/[\r\n]+/g, " ").trim();
            let matchedCard = null;

            for (const [cardName] of Object.entries(mtgWishlist)) {
                if (cleanText.includes(cardName)) {
                    matchedCard = cardName;
                    break;
                }
            }

            if (matchedCard) {
                // Verhindert mehrfaches Zählen der gleichen Karte im Dauerstream
                if (lastScannedCard !== matchedCard) {
                    lastScannedCard = matchedCard;
                    foundCounts[matchedCard] = (foundCounts[matchedCard] || 0) + 1;
                    updateCounterDisplay();
                }

                resultBox.innerHTML = `
                    <p class="hit">🎉 TREFFER: ${capitalizeWords(matchedCard)}</p>
                    <p>Gelesen: "${escapeHtml(rawText)}"</p>
                `;
            } else {
                lastScannedCard = "";
                resultBox.innerHTML = `
                    <p class="miss">Suche läuft...</p>
                    <p style="font-size:0.8rem;">Gelesen: "${escapeHtml(rawText)}"</p>
                `;
            }
        }

        function updateCounterDisplay() {
            let html = "<ul>";
            for (const [card, count] of Object.entries(foundCounts)) {
                html += `<li>${capitalizeWords(card)}: <strong>${count}x</strong> gefunden</li>`;
            }
            html += "</ul>";
            counterListDiv.innerHTML = html;
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        function capitalizeWords(str) {
            return str.replace(/\b\w/g, l => l.toUpperCase());
        }

        // Kamera beim Laden starten
        window.addEventListener('load', initCamera);
    </script>
</body>
</html>
